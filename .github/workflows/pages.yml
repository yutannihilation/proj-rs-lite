name: Deploy Demo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Install build dependencies
        run: brew install sqlite3

      - name: Setup Emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build WebAssembly package
        run: |
          cargo build --release --target wasm32-unknown-emscripten -p proj-lite-web
          ls ./target/wasm32-unknown-emscripten/release/proj_lite_web.wasm

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site/npm
          cp web/index.html site/index.html
          cp web/main.js site/main.js
          cp web/init.js site/init.js
          cp web/env.js site/npm/env.js
          cp web/wasi_snapshot_preview1.js site/npm/wasi_snapshot_preview1.js
          cp target/wasm32-unknown-emscripten/release/proj_lite_web.wasm site/npm/proj_lite_web.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
